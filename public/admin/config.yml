                  - { <<: *text, label: "App", name: app }
                  - { <<: *text, label: "Marketplace", name: marketplace }
                  - { <<: *text, label: "Story", name: story }
                  - { <<: *text, label: "Released", name: released }
                  - { <<: *text, label: "No public link", name: noPublicLink }
                  - { <<: *text, label: "New tab", name: newTab, hint: 'Keep {name}' }
                  - { <<: *text, label: "Link of", name: linkOf, hint: 'Keep {link} {project}' }
              - label: Card text
                name: cards
                widget: object
                i18n: true
                fields:
                  - { <<: *text, label: "Key achievements", name: keyAchievements }
                  - { <<: *text, label: "Technologies used", name: technologiesUsed }
                  - { <<: *text, label: "Skills used", name: skillsUsed }
                  - { <<: *text, label: "Category technologies", name: categoryTechnologies, hint: 'Keep {name}' }
                  - { <<: *text, label: "Tech by category", name: techByCategory }
                  - { <<: *text, label: "Featured", name: featured }
                  - { <<: *text, label: "Impact", name: impact }
                  - { <<: *text, label: "Tech", name: tech }
                  - { <<: *text, label: "No posts", name: noPosts }
                  - { <<: *text, label: "Job span", name: jobSpan, hint: 'Keep {title} {company} {start} {end}' }
                  - { <<: *text, label: "Cyberware", name: cyberware, hint: 'Keep {type}' }
                  - { <<: *text, label: "Details", name: details }
              - label: Years
                name: years
                widget: object
                i18n: true
                fields:
