                  - { <<: *text, label: "Profession details", name: professionDetails, hint: 'Keep {profession}' }
                  - { <<: *text, label: "Select your profession", name: selectYourProfession }
                  - { <<: *text, label: "Primary navigation", name: primaryNavigation }
                  - { <<: *text, label: "Skip to content", name: skipToContent }
                  - { <<: *text, label: "Loading theme", name: loadingTheme }
                  - { <<: *text, label: "Loading", name: loading }
