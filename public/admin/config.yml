                i18n: true
                fields:
                  - { <<: *text, label: "Get in touch", name: getInTouch }
                  - { <<: *text, label: "Download CV", name: downloadCv }
                  - { <<: *text, label: "CV", name: cv }
                  - { <<: *text, label: "Get the CV", name: getCv }
                  - { <<: *text, label: "Resume", name: resume }
                  - { <<: *text, label: "Engine", name: engine }
                  - { <<: *text, label: "Engine short", name: engineShort }
                  - { <<: *text, label: "View engine", name: viewEngine }
                  - { <<: *text, label: "Play demo", name: playDemo }
                  - { <<: *text, label: "Play", name: play }
                  - { <<: *text, label: "Portfolio", name: portfolio }
                  - { <<: *text, label: "Enter", name: enter }
                  - { <<: *text, label: "Email me", name: emailMe }
                  - { <<: *text, label: "Email me at", name: emailMeAt, hint: 'Keep {email}' }
                  - { <<: *text, label: "Linkedin", name: linkedin }
